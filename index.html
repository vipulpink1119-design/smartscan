<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <!-- મોબાઈલમાં ઝૂમ અટકાવવા અને ફુલ સ્ક્રીન લેઆઉટ માટે -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>લેન્ડસ્કેપ માર્ક્સ સ્કેનર</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* બોડીને આખી સ્ક્રીનમાં ફેલાવવા અને સ્ક્રોલ બંધ કરવા માટે */
        body { 
            margin: 0; padding: 0; background-color: black; 
            overflow: hidden; color: white; font-family: Arial, sans-serif; 
        }
        
        /* ફુલ સ્ક્રીન કેમેરા કન્ટેનર */
        #scannerUI { 
            position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 1; 
        }
        
        #videoElement { 
            width: 100%; height: 100%; object-fit: cover; 
        }
        
        /* ટાર્ગેટ બોક્સ (લાલ અને ઘાટું) */
        .target-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; /* મોબાઈલ આડો હોય ત્યારે આખી પહોળાઈ રોકશે */
            height: 22%; /* માર્ક્સના ખાના મુજબ સેટ કરેલ */
            border: 4px solid #ff3b30; /* ઘાટો લાલ રંગ */
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65); /* આજુબાજુનો ભાગ વધુ અંધારો કર્યો */
            z-index: 2;
        }
        
        /* 14 ખાનાઓની સ્પષ્ટ લાઈનો */
        .grid-lines {
            display: flex; height: 100%; width: 100%;
        }
        .grid-lines div {
            flex: 1; 
            border-right: 2.5px solid #ff3b30; /* જાડી અને લાલ લાઈન */
        }
        .grid-lines div:last-child { border: none; }

        /* ઉપરની સૂચના */
        .top-bar {
            position: absolute; top: 15px; left: 0; width: 100%; 
            z-index: 5; text-align: center; text-shadow: 2px 2px 4px black;
        }

        /* નીચેના બટનો (અંગૂઠાથી દબાવવા માટે અનુકૂળ) */
        .controls {
            position: absolute; bottom: 25px; left: 0; width: 100%; 
            z-index: 5; display: flex; justify-content: center; gap: 15px;
        }
        
        .btn-custom {
            padding: 12px 30px; font-size: 1.2rem; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold;
        }

        #previewArea { display: none; padding: 20px; z-index: 10; position: relative; background: #f8f9fa; height: 100vh; color: black; }
        .cropped-img { border: 3px solid #ff3b30; width: 100%; max-width: 800px; margin: 15px 0; border-radius: 5px; }
    </style>
</head>
<body>

<!-- કેમેરા સ્ક્રીન -->
<div id="scannerUI">
    <div class="top-bar">
        <h4 class="fw-bold mb-0">મોબાઈલને આડો (Landscape) પકડો</h4>
        <small>લાલ બોક્સમાં માર્ક્સ સેટ કરો</small>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    
    <div class="target-box" id="targetBox">
        <div class="grid-lines">
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-warning btn-custom" id="startBtn" onclick="startCamera()">૧. કેમેરા ઓન</button>
        <button class="btn btn-success btn-custom" id="captureBtn" onclick="captureAndCrop()" disabled>
            📸 સ્કેન (Capture)
        </button>
    </div>
</div>

<!-- છુપો કેનવાસ -->
<canvas id="hiddenCanvas" style="display:none;"></canvas>

<!-- પરિણામ સ્ક્રીન -->
<div id="previewArea" class="text-center">
    <h3 class="text-primary fw-bold mt-3">આટલો જ ફોટો AI ને જશે:</h3>
    <img id="croppedResult" class="cropped-img" src="" alt="Cropped Marks">
    
    <div class="mt-4 d-flex justify-content-center gap-3">
        <button class="btn btn-secondary btn-lg" onclick="location.reload()">ફરીથી સ્કેન કરો</button>
        <button class="btn btn-primary btn-lg px-5">ડેશબોર્ડમાં મોકલો ➡️</button>
    </div>
</div>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('hiddenCanvas');
    const targetBox = document.getElementById('targetBox');
    
    async function startCamera() {
        try {
            // કેમેરાને હાઈ-રિઝોલ્યુશનમાં ખોલવાનો પ્રયાસ
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
            });
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                document.getElementById('captureBtn').disabled = false;
                // કેમેરા ઓન થયા પછી 'કેમેરા ઓન' બટન હટાવી લેવું, જેથી સ્કેન બટન પર ફોકસ રહે
                document.getElementById('startBtn').style.display = 'none';
            };
        } catch (err) {
            alert("કેમેરા ચાલુ કરવામાં ભૂલ: " + err.message);
        }
    }

    function captureAndCrop() {
        // કેમેરાના અસલી રિઝોલ્યુશન મુજબ કેનવાસ સેટ કરો
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // UI બોક્સનું માપ કાઢો
        const videoRect = video.getBoundingClientRect();
        const boxRect = targetBox.getBoundingClientRect();

        // સ્કેલિંગ કાઢો
        const scaleX = canvas.width / videoRect.width;
        const scaleY = canvas.height / videoRect.height;

        const cropX = (boxRect.left - videoRect.left) * scaleX;
        const cropY = (boxRect.top - videoRect.top) * scaleY;
        const cropWidth = boxRect.width * scaleX;
        const cropHeight = boxRect.height * scaleY;

        // કાપવા માટે નવો કેનવાસ
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropWidth;
        cropCanvas.height = cropHeight;
        const cropCtx = cropCanvas.getContext('2d');

        cropCtx.drawImage(
            canvas, 
            cropX, cropY, cropWidth, cropHeight, 
            0, 0, cropWidth, cropHeight          
        );

        const finalImage = cropCanvas.toDataURL('image/jpeg', 1.0);
        
        document.getElementById('croppedResult').src = finalImage;
        document.getElementById('scannerUI').style.display = 'none';
        document.getElementById('previewArea').style.display = 'block';
    }
</script>

</body>
</html>
